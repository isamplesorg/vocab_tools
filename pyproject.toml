[project]
name = "vocab-tools"
version = "0.2.0"
description = "Tools for validating and working with iSamples SKOS vocabularies."
authors = [{ name = "datadave", email = "605409+datadavev@users.noreply.github.com" }]
requires-python = ">=3.11"
dependencies = [
    "click>=8",
    "pyshacl>=0.30.0",
    "rdflib>=7",
    "rich>=13",
]

[project.scripts]
vocab = "vocab_tools.cli:main"

[dependency-groups]
dev = [
    "graphviz>=0",
    "jupyter>=1",
    "pytest>=7.4.0",
]
service = [
    "rdflib-endpoint>=0.5.1",
    "uvicorn>=0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
